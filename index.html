<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LUA GAMES - FIXED REAL</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:#0a1a0f;touch-action:none;overscroll-behavior:none}
*{box-sizing:border-box;font-family:system-ui;-webkit-tap-highlight-color:transparent}
#app{width:100vw;height:100dvh;display:flex;flex-direction:column;position:fixed;inset:0;background:#000}
#topBar{height:50px;min-height:50px;background:#000;display:flex;justify-content:space-between;align-items:center;padding:0 8px;color:#fff;z-index:10;border-bottom:1px solid #2ecc71}
.hud{font-size:9px;font-weight:800;background:#162a1d;padding:4px 7px;border-radius:20px;border:1px solid #2ecc71;display:inline-flex}
#healthBar{position:absolute;top:54px;left:8px;width:110px;height:8px;background:#330000;border:1px solid #ff0000;border-radius:10px;overflow:hidden;z-index:7}
#healthFill{height:100%;width:100%;background:#2ecc71;transition:width 0.2s}
#gameWrap{flex:1;position:relative;overflow:hidden;background:#1a3320;width:100%;height:calc(100dvh - 50px)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#minimap{position:absolute;top:6px;right:6px;width:86px;height:62px;border:1px solid #2ecc71;border-radius:8px;background:rgba(0,0,0,0.8);z-index:6}
#controls{position:absolute;bottom:0;left:0;width:100%;height:130px;pointer-events:none;z-index:6;display:flex;justify-content:space-between;align-items:flex-end;padding:6px 10px;padding-bottom:env(safe-area-inset-bottom)}
.joy{pointer-events:auto;width:96px;height:96px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:50%;position:relative}
.stick{width:40px;height:40px;background:#2ecc71;border-radius:50%;position:absolute;left:28px;top:28px;box-shadow:0 0 10px #2ecc71}
.cbtn{pointer-events:auto;width:48px;height:48px;background:rgba(0,0,0,0.75);border:2px solid #2ecc71;border-radius:50%;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;margin:3px}
#damageFlash{position:absolute;inset:0;background:rgba(255,0,0,0.35);z-index:8;pointer-events:none;display:none}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,0.96);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px;color:#fff;text-align:center;overflow-y:auto}
.card{background:#112118;border:1px solid #234d2f;border-radius:12px;padding:9px;width:100%;max-width:360px;margin:5px 0}
.btn{border:none;padding:11px 18px;border-radius:30px;font-weight:900;cursor:pointer;width:100%;margin-top:6px;font-size:11px}
.btn-green{background:#2ecc71;color:#000}.btn-dark{background:#1a1a1a;color:#fff;border:1px solid #333}
.avatarBox{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;max-height:26vh;overflow-y:auto}
.avatar{border:2px solid #1a3a22;border-radius:10px;background:#0a1710;padding:5px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.avatar.active{border-color:#2ecc71;box-shadow:0 0 8px #2ecc71}
#luaSplash{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="app">
<div id="luaSplash"><div style="text-align:center"><h1 style="color:#2ecc71;font-size:38px;font-weight:900;letter-spacing:5px">LUA GAMES</h1><p style="color:#f1c40f;font-size:8px;margin-top:4px">FIXED - NO GLITCH - REAL HOUSES</p><div style="width:200px;height:4px;background:#111;margin:12px auto;border-radius:10px;overflow:hidden"><div id="loadFill" style="height:100%;width:0%;background:#2ecc71;transition:width 0.1s"></div></div></div></div>
<div id="topBar"><div style="display:flex;gap:3px"><span class="hud">💰 <span id="coins">0</span></span><span class="hud">🎯 <span id="zkill">0</span>/5</span><span class="hud">LVL <span id="lvl">1</span></span><span class="hud" id="locHud">🏘️ COMPOUND</span><span class="hud" id="bossHud" style="display:none;background:#4a0000;border-color:#ff0000">👹 BOSS</span></div><div style="display:flex;gap:3px"><span class="hud">❤️ <span id="hp">100</span></span><button onclick="flashOn=!flashOn" style="background:#111;border:1px solid #f1c40f;color:#fff;width:26px;height:26px;border-radius:50%;font-size:10px">🔦</button></div></div>
<div id="healthBar"><div id="healthFill"></div></div>
<div id="damageFlash"></div>
<div id="gameWrap"><canvas id="game"></canvas><canvas id="minimap"></canvas><div id="controls"><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div style="pointer-events:auto;display:flex;flex-direction:column"><button class="cbtn" onclick="tryShoot()">🔫</button><div style="display:flex"><button class="cbtn" style="width:40px;height:40px;border-color:#f1c40f;font-size:12px" onclick="tryEnter()">🚪</button><button class="cbtn" style="width:40px;height:40px;border-color:#3498db;font-size:11px" ontouchstart="isSprint=true" ontouchend="isSprint=false">🏃</button></div></div></div><div id="overlay"></div></div>
</div>
<script>
let audioCtx;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function tone(f,d){if(!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d);}

const soldierImg=new Image(); soldierImg.crossOrigin="anonymous"; soldierImg.src='https://www.pngplay.com/wp-content/uploads/4/Soldier-Transparent-Background.png';
const gunImgs=[];['https://www.pngplay.com/wp-content/uploads/6/Gun-Transparent-Background.png','https://www.pngplay.com/wp-content/uploads/6/Shotgun-Transparent-Background.png','https://www.pngplay.com/wp-content/uploads/6/AK-47-Transparent-Background.png','https://www.pngplay.com/wp-content/uploads/6/AK-47-Transparent-PNG.png'].forEach((u,i)=>{gunImgs[i]=new Image(); gunImgs[i].crossOrigin="anonymous"; gunImgs[i].src=u;});
let housePics=[
 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=400&q=80',
 'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=400&q=80',
 'https://images.unsplash.com/photo-1600607687644-c7171b42498b?w=400&q=80',
 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400&q=80',
 'https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=400&q=80'
];
let houseImgs=[]; housePics.forEach((u,i)=>{houseImgs[i]=new Image(); houseImgs[i].crossOrigin="anonymous"; houseImgs[i].src=u;});

let load=0,li=setInterval(()=>{load+=Math.random()*15;if(load>=100){load=100;clearInterval(li);setTimeout(()=>{document.getElementById('luaSplash').style.display='none';showMenu()},300);}document.getElementById('loadFill').style.width=load+'%';},80);

const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const mini=document.getElementById('minimap'),mctx=mini.getContext('2d');
function resize(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);mini.width=86*2;mini.height=62*2;mctx.setTransform(2,0,0,2,0,0);}addEventListener('resize',resize);resize();
let W=()=>canvas.clientWidth,H=()=>canvas.clientHeight;
let player={x:400,y:400,angle:0,health:100,maxHealth:100,avatar:0,gun:0},zombies=[],bullets=[],blood=[],healthPacks=[],houses=[],coins=parseInt(localStorage.getItem('lua_coins')||'600'),level=parseInt(localStorage.getItem('lua_lvl')||'1'),killed=0,gameState='menu',keys={x:0,y:0},shootCD=0,camera={x:0,y:0},isSprint=false,inHouse=false,currentHouse=null,flashOn=true,isBossLevel=false;
let unlockedAv=JSON.parse(localStorage.getItem('lua_av')||'[0,1]'),unlockedGuns=JSON.parse(localStorage.getItem('lua_guns')||'[0]');

const AVATARS=[
 {name:'RECRUIT',price:0,hp:100,spd:3.3,filter:'none'},
 {name:'COMMANDO',price:0,hp:100,spd:3.5,filter:'hue-rotate(80deg)'},
 {name:'SWAT',price:120,hp:120,spd:3.3,filter:'hue-rotate(200deg)'},
 {name:'GHOST',price:300,hp:110,spd:3.8,filter:'grayscale(1)'},
 {name:'MARINE',price:600,hp:140,spd:3.3,filter:'hue-rotate(20deg) saturate(1.5)'},
 {name:'SNIPER',price:900,hp:100,spd:3.6,filter:'hue-rotate(150deg)'},
 {name:'HEAVY',price:1400,hp:180,spd:3.0,filter:'hue-rotate(10deg) brightness(1.2)'},
 {name:'CYBORG',price:2200,hp:150,spd:3.9,filter:'hue-rotate(180deg) saturate(2)'},
 {name:'TITAN',price:3500,hp:200,spd:3.5,filter:'sepia(1)'},
 {name:'LEGEND',price:6000,hp:250,spd:4.1,filter:'drop-shadow(0 0 4px gold)'},
];
const GUNS=[
 {name:'GLOCK',dmg:55,fire:0.24,price:0,icon:'🔫',real:'Glock 19'},
 {name:'SHOTGUN',dmg:95,fire:0.65,price:150,icon:'💣',real:'Remington 870'},
 {name:'M4A1',dmg:65,fire:0.14,price:300,icon:'🔧',real:'M4A1 Rifle'},
 {name:'AK-47',dmg:80,fire:0.11,price:550,icon:'🔥',real:'AK-47'},
];

function buildHouses(){
 houses=[
  {x:200,y:200,w:200,h:150,doorX:300,doorY:350,name:'House 1',pic:0,zombiesInside:2},
  {x:650,y:150,w:210,h:160,doorX:755,doorY:310,name:'House 2',pic:1,zombiesInside:3},
  {x:1100,y:190,w:200,h:150,doorX:1200,doorY:340,name:'House 3',pic:2,zombiesInside:2},
  {x:280,y:650,w:210,h:160,doorX:385,doorY:810,name:'House 4',pic:3,zombiesInside:2},
  {x:850,y:700,w:220,h:170,doorX:960,doorY:870,name:'House 5',pic:4,zombiesInside:3},
 ];
}
buildHouses();
function canMove(x,y){
 if(inHouse){if(x<35||x>765||y<35||y>565) return false; return true;}
 else{for(let h of houses){if(Math.hypot(x-h.doorX,y-h.doorY)<60) continue; if(x>h.x&&x<h.x+h.w&&y>h.y&&y<h.y+h.h) return false;} if(x<15||x>1985||y<15||y>1185) return false; return true;}
}
function updateCam(){if(inHouse){camera.x=0;camera.y=0;}else{camera.x=Math.max(0,Math.min(2000-W(),player.x-W()/2));camera.y=Math.max(0,Math.min(1200-H(),player.y-H()/2));}}
function spawnInside(){
 zombies=[];blood=[];healthPacks=[];killed=0;isBossLevel=(level%5===0);
 let count=isBossLevel?1:currentHouse.zombiesInside;
 for(let i=0;i<count;i++){let x,y;do{x=80+Math.random()*600;y=80+Math.random()*380;}while(Math.hypot(x-player.x,y-player.y)<100);zombies.push({x,y,speed:0.6+Math.random()*0.5,hp:isBossLevel?350:100,isBoss:isBossLevel,anim:Math.random()*10,attackCD:0,state:'wander',wanderAngle:Math.random()*6});}
 for(let i=0;i<2;i++){let x,y;do{x=60+Math.random()*680;y=60+Math.random()*480;}while(!canMove(x,y));healthPacks.push({x,y,active:true});}
 document.getElementById('bossHud').style.display=isBossLevel?'inline-flex':'none';
}
function drawCompound(){
 // FIXED: no more stretched repeating - clean grass + real houses
 ctx.fillStyle='#1e4d2b';ctx.fillRect(0,0,W(),H());
 // grass dots
 ctx.fillStyle='rgba(0,0,0,0.15)';for(let i=0;i<80;i++){let gx=((i*137)%2000-camera.x),gy=((i*241)%1200-camera.y);if(gx>-10&&gx<W()+10&&gy>-10&&gy<H()+10)ctx.fillRect(gx,gy,2,2);}
 // draw 5 real houses - FIXED positions
 houses.forEach(h=>{
  let sx=h.x-camera.x,sy=h.y-camera.y;
  if(sx<-250||sx>W()+250||sy<-250||sy>H()+250) return;
  // real house photo
  let img=houseImgs[h.pic];
  if(img&&img.complete&&img.naturalWidth>0){
   ctx.drawImage(img,sx,sy,h.w,h.h);
  }else{
   ctx.fillStyle='#8B4513';ctx.fillRect(sx,sy,h.w,h.h);
   ctx.fillStyle='#5a2e0c';ctx.fillRect(sx,sy, h.w, 12);
  }
  // door
  ctx.fillStyle='#2ecc71';ctx.strokeStyle='#fff';ctx.lineWidth=1;
  ctx.fillRect(h.doorX-camera.x-14,h.doorY-camera.y-8,28,14);ctx.strokeRect(h.doorX-camera.x-14,h.doorY-camera.y-8,28,14);
  ctx.fillStyle='#000';ctx.font='bold 8px sans-serif';ctx.fillText('ENTER',h.doorX-camera.x-14,h.doorY-camera.y+1);
  // name
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(sx,sy-14,h.w,12);ctx.fillStyle='#fff';ctx.font='bold 8px sans-serif';ctx.fillText(h.name+(level%5==0?' 👹':''),sx+4,sy-4);
 });
}
function drawInterior(){
 ctx.fillStyle='#0f0a06';ctx.fillRect(0,0,W(),H());
 ctx.fillStyle='#2a1e14';ctx.fillRect(20,20,W()-40,H()-40);
 ctx.strokeStyle='#5a3a2a';ctx.lineWidth=3;ctx.strokeRect(20,20,W()-40,H()-40);
 ctx.fillStyle='#2ecc71';ctx.fillRect(W()/2-35,H()-50,70,30);ctx.fillStyle='#000';ctx.font='bold 9px sans-serif';ctx.fillText('EXIT',W()/2-10,H()-32);
 ctx.fillStyle=isBossLevel?'#ff4444':'#fff';ctx.font='bold 10px sans-serif';ctx.fillText((isBossLevel?'👹 BOSS! ':'🏠 ')+currentHouse.name+' - '+GUNS[player.gun].real,26,36);
 healthPacks.forEach(h=>{if(!h.active)return;ctx.fillStyle='#ff0000';ctx.fillRect(h.x-camera.x-7,h.y-camera.y-7,14,14);ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.fillText('+',h.x-camera.x-3,h.y-camera.y+3);if(Math.hypot(player.x-h.x,player.y-h.y)<22){h.active=false;player.health=Math.min(player.maxHealth,player.health+45);coins+=10;}});
}
function drawSoldier(x,y,ang){
 ctx.save();ctx.translate(x,y);ctx.rotate(ang+Math.PI/2);
 let av=AVATARS[player.avatar];
 if(soldierImg.complete){ctx.filter=av.filter;ctx.drawImage(soldierImg,-26,-30,52,60);ctx.filter='none';let g=gunImgs[player.gun];if(g&&g.complete){ctx.rotate(-0.15);ctx.drawImage(g,8,-10,40,15);if(shootCD>0.12){ctx.fillStyle='#ffff00';ctx.shadowColor='#ffff00';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(48,-2,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}}}else{ctx.fillStyle='#2ecc71';ctx.fillRect(-10,-10,20,30);}
 ctx.restore();
}
function drawZombie(z){
 ctx.save();ctx.translate(z.x-camera.x,z.y-camera.y);if(z.isBoss)ctx.scale(1.6,1.6);ctx.translate(Math.cos(z.anim*0.7)*2,Math.sin(z.anim)*3);
 if(z.state==='attack'){ctx.fillStyle='rgba(255,0,0,0.35)';ctx.beginPath();ctx.arc(0,-8,16,0,Math.PI*2);ctx.fill();}
 if(soldierImg.complete){ctx.globalAlpha=0.92;ctx.filter=z.isBoss?'hue-rotate(-20deg) saturate(3) brightness(1.1)':'hue-rotate(90deg) saturate(1.8) brightness(0.55)';ctx.drawImage(soldierImg,-22,-26,44,52);ctx.filter='none';}
 ctx.restore();
 if(z.hp<(z.isBoss?350:100)){ctx.fillStyle='#000';ctx.fillRect(z.x-camera.x-16,z.y-camera.y-40,32,5);ctx.fillStyle=z.isBoss?'#ff0000':'#ffaa00';ctx.fillRect(z.x-camera.x-16,z.y-camera.y-40,32*(z.hp/(z.isBoss?350:100)),5);}
}
function showDamage(){let f=document.getElementById('damageFlash');f.style.display='block';setTimeout(()=>f.style.display='none',100);if(navigator.vibrate) navigator.vibrate(60);}

function loop(){
 requestAnimationFrame(loop);if(gameState!=='playing')return;
 let spd=AVATARS[player.avatar].spd*(isSprint?1.8:1);
 let nx=player.x+keys.x*spd,ny=player.y+keys.y*spd;
 if(canMove(nx,player.y))player.x=nx;if(canMove(player.x,ny))player.y=ny;
 if(shootCD>0)shootCD-=0.016;updateCam();

 if(inHouse) drawInterior(); else drawCompound();

 ctx.fillStyle='rgba(100,0,0,0.45)';blood.forEach(b=>{ctx.beginPath();ctx.arc(b.x-camera.x,b.y-camera.y,b.s,0,Math.PI*2);ctx.fill();});

 zombies.forEach(z=>{
  z.anim+=0.13;let dist=Math.hypot(player.x-z.x,player.y-z.y);
  if(dist<360||inHouse){
   z.state='chase';let a=Math.atan2(player.y-z.y,player.x-z.x)+Math.sin(z.anim*0.5)*0.28;
   let sp=z.isBoss?z.speed*0.75:z.speed*(dist<90?1.5:1);
   let nzx=z.x+Math.cos(a)*sp,nzy=z.y+Math.sin(a)*sp;
   if(canMove(nzx,z.y))z.x=nzx;if(canMove(z.x,nzy))z.y=nzy;
   if(dist<(z.isBoss?42:32)){z.state='attack';if(z.attackCD<=0){player.health-=z.isBoss?15:7;z.attackCD=z.isBoss?0.9:0.75;showDamage();tone(70,0.2);if(player.health<=0)showGameOver();}}
  }else{z.state='wander';z.wanderAngle+=(Math.random()-0.5)*0.2;let nzx=z.x+Math.cos(z.wanderAngle)*z.speed*0.5,nzy=z.y+Math.sin(z.wanderAngle)*z.speed*0.5;if(canMove(nzx,z.y))z.x=nzx;if(canMove(z.x,nzy))z.y=nzy;}
  if(z.attackCD>0)z.attackCD-=0.016;
 });

 bullets.forEach(b=>{b.x+=Math.cos(b.a)*b.s;b.y+=Math.sin(b.a)*b.s;});
 for(let i=bullets.length-1;i>=0;i--){
  let hit=false;
  for(let j=zombies.length-1;j>=0;j--){
   let r=zombies[j].isBoss?42:28;
   if(Math.hypot(bullets[i].x-zombies[j].x,bullets[i].y-zombies[j].y)<r){
    zombies[j].hp-=GUNS[player.gun].dmg*(AVATARS[player.avatar].name==='SNIPER'?1.3:1);
    blood.push({x:zombies[j].x,y:zombies[j].y,s:zombies[j].isBoss?14:9});
    if(zombies[j].hp<=0){zombies.splice(j,1);killed++;coins+=zombies[j].isBoss?150:40;}
    bullets.splice(i,1);hit=true;break;
   }
  }
  if(hit)continue;if(!canMove(bullets[i].x,bullets[i].y))bullets.splice(i,1);
 }

 drawSoldier(player.x-camera.x,player.y-camera.y,player.angle);
 zombies.forEach(z=>drawZombie(z));
 bullets.forEach(b=>{ctx.fillStyle='#ffeb3b';ctx.shadowColor='#ffeb3b';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(b.x-camera.x,b.y-camera.y,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;});

 if(inHouse&&flashOn){
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W(),H());
  let grd=ctx.createRadialGradient(player.x-camera.x,player.y-camera.y,18,player.x-camera.x,player.y-camera.y,160);
  grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(1,'rgba(0,0,0,0.75)');
  ctx.fillStyle=grd;ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(player.x-camera.x,player.y-camera.y,160,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';
 }

 mctx.clearRect(0,0,86,62);mctx.fillStyle='#0a1a0f';mctx.fillRect(0,0,86,62);
 if(!inHouse){houses.forEach(h=>{mctx.fillStyle='#8B4513';mctx.fillRect(h.x/23,h.y/19,h.w/23,h.h/19);});}
 mctx.fillStyle='#2ecc71';mctx.fillRect(player.x/23,player.y/19,3,3);mctx.fillStyle='#ff0000';zombies.forEach(z=>mctx.fillRect(z.x/23,z.y/19,z.isBoss?4:2,2));

 document.getElementById('coins').innerText=coins;document.getElementById('hp').innerText=Math.max(0,Math.floor(player.health));
 document.getElementById('healthFill').style.width=(player.health/player.maxHealth*100)+'%';
 document.getElementById('healthFill').style.background=player.health<30?'#ff0000':player.health<60?'#ffaa00':'#2ecc71';
 document.getElementById('zkill').innerText=killed;document.getElementById('lvl').innerText=level;
 document.getElementById('locHud').innerText=inHouse?currentHouse.name.toUpperCase():'COMPOUND';
 localStorage.setItem('lua_coins',coins);
 if(inHouse && killed>= (isBossLevel?1:currentHouse.zombiesInside)){setTimeout(()=>exitHouse(true),600);}
}loop();

function tryEnter(){if(inHouse){exitHouse(false);return;}for(let h of houses){if(Math.hypot(player.x-h.doorX,player.y-h.doorY)<62){enterHouse(h);return;}}}
function enterHouse(h){inHouse=true;currentHouse=h;player.x=400;player.y=300;spawnInside();initAudio();}
function exitHouse(cleared){
 inHouse=false;
 if(cleared){coins+=isBossLevel?300:120;if(isBossLevel){level++;localStorage.setItem('lua_lvl',level);}let idx=houses.indexOf(currentHouse);if(idx>-1)houses.splice(idx,1);if(houses.length===0){if(isBossLevel)showLevelComplete();else buildHouses();}}
 player.x=currentHouse.doorX;player.y=currentHouse.doorY+48;currentHouse=null;zombies=[];killed=0;isBossLevel=false;document.getElementById('bossHud').style.display='none';
}
canvas.addEventListener('pointerdown',e=>{
 initAudio();
 let rect=canvas.getBoundingClientRect();
 let mx=(e.clientX-rect.left)/rect.width*W()+camera.x,my=(e.clientY-rect.top)/rect.height*H()+camera.y;
 let hit=null;zombies.forEach(z=>{if(Math.hypot(mx-z.x,my-z.y)<62)hit=z;});
 if(hit)tryShoot(hit.x,hit.y);else tryShoot(mx,my);
});
function tryShoot(tx,ty){
 if(shootCD>0||gameState!=='playing')return;
 let ang=player.angle;if(tx!==undefined)ang=Math.atan2(ty-player.y,tx-player.x);
 player.angle=ang;bullets.push({x:player.x+30*Math.cos(ang),y:player.y+30*Math.sin(ang),a:ang,s:14});shootCD=GUNS[player.gun].fire;tone(180,0.08);
}
let joy=document.getElementById('joy'),stick=document.getElementById('stick'),dragging=false;
joy.addEventListener('pointerdown',()=>dragging=true);
addEventListener('pointermove',e=>{
 if(!dragging)return;
 let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,dist=Math.min(36,Math.hypot(dx,dy)),ang=Math.atan2(dy,dx);
 stick.style.left=(28+Math.cos(ang)*dist)+'px';stick.style.top=(28+Math.sin(ang)*dist)+'px';
 keys.x=Math.cos(ang)*(dist/36);keys.y=Math.sin(ang)*(dist/36);
 if(dist>6)player.angle=ang;
});
addEventListener('pointerup',()=>{dragging=false;stick.style.left='28px';stick.style.top='28px';keys.x=0;keys.y=0;});

function showMenu(){
 gameState='menu';
 document.getElementById('overlay').innerHTML=`
 <h1 style="color:#2ecc71;font-size:20px;font-weight:900;letter-spacing:3px">LUA GAMES</h1>
 <p style="color:#888;font-size:7px">FIXED - CLEAN REAL HOUSES - NO GLITCH</p>
 <div class="card"><p style="font-size:8px;font-weight:900">10 REAL SOLDIERS - 💰 ${coins}</p>
 <div class="avatarBox">${AVATARS.map((a,i)=>`<div class="avatar ${player.avatar==i?'active':''}" onclick="selectAv(${i})"><div style="width:18px;height:18px;border-radius:50%;background:#ffdbac;filter:${a.filter};border:2px solid #2ecc71"></div><small style="font-size:6px;font-weight:800">${a.name}</small><small style="font-size:5px">${a.price==0?'FREE':'$'+a.price}</small></div>`).join('')}</div></div>
 <div class="card"><p style="font-size:8px;font-weight:900">4 REAL GUNS</p>
 ${GUNS.map((g,i)=>`<div style="display:flex;justify-content:space-between;padding:5px;border:1px solid #234d2f;border-radius:8px;margin:2px 0;background:#0a1710;font-size:8px"><span>${g.icon} ${g.name} ${g.dmg} DMG</span><button style="border:none;padding:3px 8px;border-radius:20px;font-size:8px;font-weight:800;background:${unlockedGuns.includes(i)?(player.gun==i?'#2ecc71':'#222'):'#333'};color:#fff" onclick="selectGun(${i})">${unlockedGuns.includes(i)?(player.gun==i?'ON':'USE'):'$'+g.price}</button></div>`).join('')}</div>
 <button class="btn btn-green" onclick="startCompound()">▶ PLAY FIXED COMPOUND - LVL ${level} ${level%5==0?'👹 BOSS':''}</button>
 <p style="font-size:6px;color:#555;margin-top:4px">Fixed: No more repeating houses, clean grass, real house photos load one by one</p>
 `;
 document.getElementById('overlay').style.display='flex';
}
function selectAv(i){let av=AVATARS[i];if(!unlockedAv.includes(i)){if(coins>=av.price){coins-=av.price;unlockedAv.push(i);localStorage.setItem('lua_coins',coins);localStorage.setItem('lua_av',JSON.stringify(unlockedAv));player.avatar=i;showMenu();}else alert('Need $'+av.price);return;}player.avatar=i;showMenu();}
function selectGun(i){if(unlockedGuns.includes(i)){player.gun=i;showMenu();return;}if(coins>=GUNS[i].price){coins-=GUNS[i].price;unlockedGuns.push(i);player.gun=i;localStorage.setItem('lua_coins',coins);localStorage.setItem('lua_guns',JSON.stringify(unlockedGuns));showMenu();}else alert('Need $'+GUNS[i].price);}
function startCompound(){player.health=AVATARS[player.avatar].hp;player.maxHealth=AVATARS[player.avatar].hp;player.x=400;player.y=400;buildHouses();document.getElementById('overlay').style.display='none';gameState='playing';inHouse=false;}
function showLevelComplete(){let b=isBossLevel?400:200;coins+=b;level++;localStorage.setItem('lua_lvl',level);localStorage.setItem('lua_coins',coins);gameState='levelComplete';document.getElementById('overlay').innerHTML=`<h2 style="color:#2ecc71">${isBossLevel?'👹 BOSS DEAD!':'HOUSE CLEARED!'}</h2><p>+${b} coins</p><button class="btn btn-green" onclick="startCompound()">NEXT LVL ${level}</button><button class="btn btn-dark" onclick="showMenu()">SHOP</button>`;document.getElementById('overlay').style.display='flex';}
function showGameOver(){gameState='gameOver';document.getElementById('overlay').innerHTML=`<h2 style="color:#ff0000;font-size:26px">YOU WERE EATEN!</h2><p>Health 100 → 0</p><button class="btn btn-green" onclick="player.health=AVATARS[player.avatar].hp;spawnInside();gameState='playing';document.getElementById('overlay').style.display='none'">RETRY</button><button class="btn btn-dark" onclick="showMenu()">MENU</button>`;document.getElementById('overlay').style.display='flex';}
</script>
